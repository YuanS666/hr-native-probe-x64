name: Build Windows Agent

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-native-probe.yml'
      - 'windows/**'
      - 'index.html'
      - 'mouse_test.cjs'
      - '*.go'
      - 'go.mod'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: false
      - name: Test browser pause/resume and mouse handling
        run: node mouse_test.cjs
      - name: One-command native and Agent build
        shell: pwsh
        run: ./windows/build.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows-agent-mf-x64
          path: release/windows-agent-mf-x64/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: linux-relay-amd64
          path: release/linux-relay-amd64/
          if-no-files-found: error
          retention-days: 7
